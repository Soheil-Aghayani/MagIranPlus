<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">MagIranPlus</title>
  <desc id="desc">A Persian academic research utility for extracting Magiran search results and exporting formatted bibliographies.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071321"/>
      <stop offset="48%" stop-color="#0d2440"/>
      <stop offset="100%" stop-color="#123c5d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="88%" cy="30%" r="58%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="22%" cy="100%" r="56%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3856"/>
      <stop offset="100%" stop-color="#0b1b31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#cyanGlow)"/>
  <rect width="1200" height="380" rx="24" fill="url(#goldGlow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#31516e" stroke-opacity="0.8" stroke-width="1.5"/>

  <g opacity="0.075" stroke="#b7d5e8" stroke-width="1">
    <path d="M80 0V380M160 0V380M240 0V380M320 0V380M400 0V380M480 0V380M560 0V380M640 0V380M720 0V380M800 0V380M880 0V380M960 0V380M1040 0V380M1120 0V380"/>
    <path d="M0 76H1200M0 152H1200M0 228H1200M0 304H1200"/>
  </g>

  <path d="M650 206H730L752 166L776 245L800 142L824 255L850 196L875 206H930" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.42"/>
  <circle cx="800" cy="142" r="4" fill="#22d3ee"/>
  <circle cx="824" cy="255" r="4" fill="#fbbf24"/>
  <circle cx="824" cy="255" r="14" fill="#fbbf24" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Layered publication cards -->
  <g transform="matrix(.97 .1 -.1 .97 1000 66)" filter="url(#shadow)">
    <rect width="190" height="250" rx="15" fill="#0a192c" stroke="#35516d" stroke-width="1.5"/>
    <rect x="20" y="28" width="78" height="9" rx="4.5" fill="#56718b"/>
    <rect x="20" y="54" width="150" height="9" rx="4.5" fill="#7890a5"/>
    <rect x="20" y="72" width="124" height="9" rx="4.5" fill="#7890a5"/>
    <rect x="20" y="108" width="150" height="6" rx="3" fill="#304862"/>
    <rect x="20" y="124" width="138" height="6" rx="3" fill="#304862"/>
    <rect x="20" y="140" width="119" height="6" rx="3" fill="#304862"/>
    <rect x="20" y="182" width="150" height="30" rx="7" fill="#102943" stroke="#274c68"/>
  </g>

  <g transform="matrix(.99 -.035 .035 .99 872 55)" filter="url(#shadow)">
    <rect width="230" height="278" rx="17" fill="url(#panel)" stroke="#22d3ee" stroke-opacity="0.42" stroke-width="1.8"/>

    <!-- Search header -->
    <rect x="20" y="20" width="190" height="32" rx="8" fill="#07182c" stroke="#2a5875"/>
    <circle cx="38" cy="36" r="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M42 40L47 45" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <rect x="57" y="31" width="93" height="9" rx="4.5" fill="#c7d9e6" opacity="0.92"/>
    <rect x="161" y="28" width="36" height="16" rx="8" fill="#173d59" stroke="#f59e0b"/>
    <text x="169" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="8.5" font-weight="800" fill="#fbbf24">۱۰۶</text>

    <!-- Article card -->
    <rect x="20" y="72" width="190" height="112" rx="10" fill="#102943" stroke="#2b5570"/>
    <rect x="34" y="87" width="74" height="20" rx="10" fill="#123e5b" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="45" y="101" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9" font-weight="700" fill="#67e8f9">مقاله</text>
    <rect x="34" y="120" width="156" height="10" rx="5" fill="#f8fafc"/>
    <rect x="34" y="137" width="132" height="10" rx="5" fill="#d5e5ef"/>
    <rect x="34" y="158" width="148" height="6" rx="3" fill="#82a2ba" opacity="0.84"/>
    <rect x="34" y="171" width="116" height="6" rx="3" fill="#82a2ba" opacity="0.84"/>

    <!-- Citation and export controls -->
    <rect x="20" y="202" width="88" height="28" rx="8" fill="#0b1a2e" stroke="#36516a"/>
    <text x="34" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="#fbbf24">APA 7th</text>
    <rect x="118" y="202" width="92" height="28" rx="8" fill="url(#cyan)"/>
    <text x="132" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="9.5" font-weight="800" fill="#ffffff">EXPORT .DOCX</text>

    <!-- Book mark -->
    <g transform="translate(185 238)">
      <path d="M0 7C8 2 15 2 23 7V34C15 29 8 29 0 34Z" fill="#0b2037" stroke="#67e8f9" stroke-width="1.5"/>
      <path d="M23 7C31 2 38 2 46 7V34C38 29 31 29 23 34Z" fill="#153b57" stroke="#22d3ee" stroke-width="1.5"/>
      <path d="M39 -2V10M33 4H45" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Brand and message -->
  <g transform="translate(72 48)">
    <rect width="286" height="28" rx="14" fill="#122943" stroke="#f59e0b" stroke-opacity="0.8"/>
    <circle cx="15" cy="14" r="4" fill="#fbbf24"/>
    <text x="28" y="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#fde68a" letter-spacing="1.35">PERSIAN ACADEMIC RESEARCH ENGINE</text>
  </g>

  <text x="72" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
    MAGIRAN<tspan fill="url(#cyan)">+</tspan>
  </text>
  <text x="74" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="500" fill="#c8d9e5">Extract, curate, and export Magiran publications</text>

  <g transform="translate(74 218)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="500" fill="#9eb5c7">
    <circle cx="6" cy="6" r="3" fill="#22d3ee"/>
    <text x="18" y="10">All authors · full pagination · deduplicated records</text>
    <circle cx="6" cy="30" r="3" fill="#fbbf24"/>
    <text x="18" y="34">APA 7th · Vancouver · IEEE · Harvard · Chicago · MLA · BibTeX</text>
  </g>

  <g transform="translate(74 302)">
    <rect width="174" height="40" rx="20" fill="url(#gold)"/>
    <text x="24" y="25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="900" fill="#0a192c" letter-spacing="0.8">LAUNCH APP →</text>
  </g>
  <g transform="translate(260 302)">
    <rect width="165" height="40" rx="20" fill="#122943" stroke="#385771" stroke-width="1.2"/>
    <text x="23" y="25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="800" fill="#e4f0f7">VIEW SOURCE</text>
  </g>
</svg>
